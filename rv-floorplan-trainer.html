// Inline placeholder + shared onerror handler for every rendered floorplan <img> —
// swaps a 404/failed remote load to a clean local graphic instead of a broken-image icon.
const NOIMG_SVG_DATAURI='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><rect width="300" height="200" fill="#e2e5ea"/><g fill="none" stroke="#9aa4b2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="60" y="58" width="180" height="120" rx="8"/><circle cx="103" cy="93" r="11"/><path d="M60 152l48-48 34 34 30-30 68 68"/></g><text x="150" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Floorplan image unavailable</text></svg>');
function imgFallback(el){ el.onerror=null; el.src=NOIMG_SVG_DATAURI; el.classList.add('img-fallback'); el.removeAttribute('data-loading'); }

/* ---------- Offline image caching (Cache API) ----------
   A plain <img src="https://..."> starts loading over the network the instant it's
   inserted into the DOM — before any async cache lookup could ever intervene. So true
   cache-first serving (including "device is offline but this was cached before") can't
   be done by just setting src directly; every floorplan <img> is instead rendered with
   a transparent placeholder + a data-ghsrc holding the real URL, and hydrateImages()
   resolves each one cache-first right after render, swapping in real pixels (or the
   "unavailable" fallback) once resolved. This also means no separate service worker is
   needed — not something a single self-contained HTML file could reliably register
   anyway (SW registration requires a real same-origin script URL, not a blob: URL). */
const IMAGE_CACHE_NAME='lot-master-images-v1';
const IMG_PLACEHOLDER_SRC='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';   // 1x1 transparent
async function fetchAndCacheImage(url){
  if(!url || !('caches' in window)) return null;
  try{
    const cache=await caches.open(IMAGE_CACHE_NAME);
    const cached=await cache.match(url);
    if(cached) return cached;                    // cache-first: served with zero network attempt
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    try{ cache.put(url,res.clone()); }catch(_){ /* Cache API write failed (seen on some WebKit builds) -- the image still displays via res below, it just won't be cached for offline use this time */ }
    return res;
  }catch(_){ return null; }                       // any failure (offline + not cached, bad URL, etc.) -> caller falls back
}
// Every floorplan <img> in the app is rendered through this helper. Local blobs/data
// URLs (images a rep attached directly on this device) need no network/cache handling
// and render immediately; remote GitHub URLs render as a placeholder + data-ghsrc for
// hydrateImages() to resolve.
function ghImg(url,attrs){
  attrs=attrs||'';
  if(!url) return '';
  if(url.startsWith('data:')||url.startsWith('blob:')) return `<img src="${esc(url)}" ${attrs} onerror="imgFallback(this)">`;
  return `<img src="${IMG_PLACEHOLDER_SRC}" data-ghsrc="${esc(url)}" data-loading="1" ${attrs} onerror="imgFallback(this)">`;
}
const MFG_LOGOS={};  // manufacturer emblem by normalized name; falls back to browse icon — populated at boot, once every dependency ghImg needs is guaranteed initialized
// Resolves every pending data-ghsrc image within `root` (defaults to the whole app)
// cache-first, swapping in real pixels or the "unavailable" placeholder once settled.
// data-ghsrc is deliberately removed immediately (existing behavior, left untouched —
// something else may rely on that early removal to avoid re-processing an in-flight
// element). data-loading is a separate, dedicated attribute that only clears once the
// fetch genuinely settles, success or failure — that's what actually drives the
// skeleton shimmer for its true duration, not the earlier-cleared data-ghsrc.
async function hydrateImages(root){
  const els=(root||document).querySelectorAll('img[data-ghsrc]');
  for(const el of els){
    const url=el.getAttribute('data-ghsrc'); if(!url) continue;
    el.removeAttribute('data-ghsrc');
    const res=await fetchAndCacheImage(url);
    if(!res){ imgFallback(el); continue; }
    try{ el.src=URL.createObjectURL(await res.blob()); el.removeAttribute('data-loading'); }
    catch(_){ imgFallback(el); }
  }
}
// Study queue pre-fetching: looks ahead from the current position for the next 3
// upcoming floorplan images (across both the classic flat-id queue and the Adaptive
// session's step objects, including every image in an upcoming match round) and warms
// both the Cache API store and the browser's own decoded-image cache, so the reveal/
// flip never has to wait on a network round-trip.
function prefetchStudyQueueImages(queue,currentIndex){
  if(!queue||!queue.length) return;
  const ids=[];
  for(let i=currentIndex+1; i<queue.length && ids.length<3; i++){
    const item=queue[i];
    if(typeof item==='string') ids.push(item);                                  // classic session: flat unit-id queue
    else if(item&&item.kind==='card'&&item.id) ids.push(item.id);                // adaptive: individual card step
    else if(item&&item.kind==='match'&&Array.isArray(item.ids)) for(const id of item.ids){ if(ids.length<3) ids.push(id); } // adaptive: match round
  }
  for(const id of ids){
    const u=state.units.find(x=>x.id===id); if(!u) continue;
    const url=unitImg(u); if(!url||url.startsWith('data:')||url.startsWith('blob:')) continue;
    fetchAndCacheImage(url).then(res=>{ if(res) new Image().src=url; });   // cache first, then warm the browser's own decode cache
  }
}
// schema check before ANY reconciliation runs — a malformed or unexpected payload
// must never be allowed to touch state
function validSyncPayload(d){
  return !!(d && typeof d==='object' && Array.isArray(d.units) && d.units.length>0
    && d.units.every(u=>u && typeof u==='object' && u.manufacturer && u.brand && u.model));
}
async function fetchWithTimeout(url,ms){
  // Deliberately not AbortController-based: some sandboxed/proxied environments relay
  // fetch() through postMessage internally, and AbortSignal objects can't be cloned for
  // that — surfacing as a confusing "AbortSignal object could not be cloned" error that
  // has nothing to do with the actual network request. A plain race achieves the same
  // observable timeout behavior (this call rejects/settles at ~ms regardless of how long
  // the underlying fetch takes) without ever constructing an AbortSignal at all. The one
  // real tradeoff: the underlying request isn't cancelled, just no longer waited on.
  let timer;
  const timeout=new Promise((_,reject)=>{ timer=setTimeout(()=>reject(Object.assign(new Error('Timed out'),{name:'AbortError'})),ms); });
  try{
    const res=await Promise.race([fetch(url), timeout]);
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
// Reconcile a validated GitHub payload into state.units. Matches existing units by
// manufacturer+brand+model (normalized) and, on a match, keeps that unit's internal
// id/SRS schedule/mastery untouched — only specs and the image path are refreshed.
// Units with no match are new (fresh id/SRS); units no longer present in the payload
// are dropped unless they're a rep's own locally-added unit (not sourced from sync/seed).
function reconcileGithubInventory(payload){
  const matchKey=(mf,brand,model)=>norm(mf)+'|'+norm(brand)+'|'+norm(model);
  const removedKey=(brand,model)=>norm(brand)+'|'+norm(model);   // same 2-part format deleteUnit() already writes to state.removedSeed
  const prevByKey=new Map((state.units||[]).map(u=>[matchKey(u.manufacturer,u.productLine,u.model),u]));
  const removed=new Set(state.removedSeed||[]);
  const userUnits=(state.units||[]).filter(u=>!u.seed);
  const next=[], seenIds=new Set();
  let changed=false;
  for(const su of payload.units){
    if(removed.has(removedKey(su.brand,su.model))) continue;
    const u={manufacturer:su.manufacturer, productLine:su.brand, model:su.model,
      rvType:su.type||'', year:su.year||'', price:(su.price??''), weight:su.weight||'', length:su.length||'',
      sleeps:'',slides:'',location:'',stock:'',vin:'',description:'',
      seed:true, seedKey:su.image||su.imageFileName||'', imageUrl: resolveImageUrl(su)||''};
    const prev=prevByKey.get(matchKey(su.manufacturer,su.brand,su.model));
    if(prev){
      u.id=prev.id; u.srs=prev.srs||newSRS(); if(prev.mastery) u.mastery=prev.mastery;
      u.sleeps=prev.sleeps||''; u.slides=prev.slides||''; u.location=prev.location||''; u.stock=prev.stock||''; u.vin=prev.vin||''; u.description=prev.description||'';
      if(prev.manufacturer!==u.manufacturer||prev.productLine!==u.productLine||prev.rvType!==u.rvType||prev.year!==u.year
        ||prev.price!==u.price||prev.weight!==u.weight||prev.length!==u.length||prev.imageUrl!==u.imageUrl) changed=true;
    } else { u.id=su.id||uid(); u.srs=newSRS(); changed=true; }   // prefer the stable id already in inventory.json — a random uid() here would never match across devices, breaking cross-device progress sync entirely
    u.tags=inferTags(u); next.push(u); seenIds.add(u.id);
  }
  if(next.length!==prevByKey.size) changed=true;   // catches removed units too, cheaply
  state.units = next.concat(userUnits.filter(u=>!seenIds.has(u.id)));
  saveState();
  return changed;
}
let ghSyncStatus={ lastSyncAt:null, lastError:null, unitCount:0 };
// scope='background' (auto, on boot) never surfaces an error to the rep; scope='force'
// (the Settings button) reports success/failure via toast. Either way, on ANY failure —
// network error, timeout, or a payload that fails schema validation — we abort without
// touching state.units/IndexedDB at all.
async function syncInventory(opts){
  opts=opts||{};
  try{
    const payload=await fetchWithTimeout(ghInventoryUrl(opts.force), SYNC_TIMEOUT_MS);
    if(!validSyncPayload(payload)){
      ghSyncStatus.lastError='Received data was not in the expected format';
      if(opts.force) toast('Sync failed: unexpected data format','warn');
      return false;
    }
    const dataChanged=reconcileGithubInventory(payload);
    ghSyncStatus={ lastSyncAt:Date.now(), lastError:null, unitCount:payload.units.length };
    if(opts.force) toast('Inventory updated!','ok');
    if((opts.force||dataChanged) && (route==='dashboard'||route==='browse'||route==='settings'||route==='study')) render();   // "subtle" — background sync only re-renders when something actually changed
    return true;
  }catch(err){
    ghSyncStatus.lastError = (err&&err.name==='AbortError') ? 'Request timed out' : ((err&&err.message)||'Network error');
    if(opts.force) toast('Sync failed: '+ghSyncStatus.lastError,'warn');
    // background failures stay silent once there's real data on screen (never interrupt a rep
    // mid-shift) -- but with zero units there's nothing to protect, so update the "loading"
    // message to an honest failure state instead of leaving it hanging indefinitely
    else if(!state.units.length && (route==='dashboard'||route==='browse'||route==='settings'||route==='study')) render();
    return false;
  }
}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unitTitle(u){ return u.model || u.productLine || 'Unit '+(u.stock||''); }

// Length can arrive as plain feet (34) or feet+inches (19' 8", 19 ft 8 in, 19'-8").
// Store whole feet as a number; store feet+inches as a clean string like 19' 8".
function parseLength(raw){
  if(raw==null||raw==='') return '';
  if(typeof raw==='number') return raw;
  let s=String(raw).trim();
  if(!s) return '';
  s=s.replace(/[\u2019\u2018]/g,"'").replace(/[\u201D\u201C]/g,'"');
  const m=s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|feet)\.?\s*-?\s*(\d+(?:\.\d+)?)?\s*(?:"|''|in|inch|inches)?\.?$/i);
  if(m){
    const ft=parseFloat(m[1]);
    const inch=(m[2]!=null&&m[2]!=='')?parseFloat(m[2]):0;
    if(!isNaN(ft)) return inch?`${ft}' ${inch}"`:ft;
  }
  if(!/['"]|ft|feet|in/i.test(s)){
    const n=parseFloat(s.replace(/[^0-9.]/g,''));
    if(!isNaN(n)) return n;
  }
  return s;
}
function fmtLength(u){
  const L=u.length;
  if(L==null||L==='') return '';
  if(typeof L==='number') return `${L} ft`;
  const s=String(L).trim();
  if(/['"]|ft|feet|in/i.test(s)) return s.replace(/\s+/g,' ');
  const n=parseFloat(s);
  return isNaN(n)?s:`${n} ft`;
}

/* ---------- Aggregations ---------- */
function dueCounts(now){
  now=now||Date.now();
  let reviewDue=0,newAvail=0;
  for(const u of state.units){ if(isReviewDue(u.srs,now)) reviewDue++; else if(isNew(u.srs)) newAvail++; }

const nrm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
// maps the inventory productLine value -> [brand, product line]
const LINE_MAP={
  avenue:['Avenue','Fifth Wheel'], avenuefifthwheel:['Avenue','Fifth Wheel'], avenueallaccessseries:['Avenue','All Access Fifth Wheel'], avenuetraveltrailer:['Avenue','Travel Trailer'],
  delta:['Delta','Travel Trailer'], deltaultralite:['Delta','Ultra-Lite'], deltasolo:['Delta','Delta Solo'],
  paradigm:['Paradigm','Paradigm Fifth Wheel'], valor:['Valor','Valor Toy Hauler'], foundation:['Foundation','Foundation'],
  imagine:['Imagine','Imagine'], imagineaim:['Imagine','Imagine Aim'], imaginexls:['Imagine','Imagine XLS'],
  influence:['Influence','Influence'], solitude:['Solitude','Solitude'],
  lineageseriesf:['Lineage','Lineage Series F'], lineageseriesm:['Lineage','Lineage Series M'], lineageseriesvt:['Lineage','Lineage Series VT'], lineageseriesvp:['Lineage','Lineage Series VP'],
  momentumgclass:['Momentum','Momentum G-Class'], momentumluxury:['Momentum','Momentum Luxury'],
  momentumgclasstraveltrailer:['Momentum','Momentum G-Class Travel Trailer'], momentummavtraveltrailer:['Momentum','Momentum MAV Travel Trailer'],
  reflection:['Reflection','Reflection 5th Wheel'], reflectiontraveltrailer:['Reflection','Reflection Travel Trailer'],
  reflection100series:['Reflection','Reflection 100-Series'], reflection150series:['Reflection','Reflection 150-Series'],
  transcend:['Transcend','Transcend'], transcendlite:['Transcend','Transcend Lite'], transcendone:['Transcend','Transcend One'], transcendxplor:['Transcend','Transcend XPLOR'],
  access:['Access','Access'], microminnie:['Micro-Minnie','Micro Minnie'], thrive:['Thrive','Thrive'], minnie:['Minnie','Minnie'],
};
function classifyUnit(u){
  const tax=findTax(u.manufacturer);                    // collapse case/spacing variants (e.g. "GRAND DESIGN" -> "Grand Design")
  const mf=tax?tax.mf:(u.manufacturer||'Other'), key=nrm(u.productLine);
  const hit=LINE_MAP[key];
  if(hit) return {mf,brand:hit[0],line:hit[1]};
  return {mf,brand:u.productLine||'Other',line:u.productLine||'Other'};
}
function orderBy(known,present){ return [...new Set([...known.filter(x=>present.includes(x)),...present])]; }
// Priority order is matched on NORMALIZED names so variants ("GRAND DESIGN",
// "Grand Design RV", extra spaces) still rank correctly instead of falling back
// to seed insertion order.
const MF_ORDER=['Grand Design','Alliance','Winnebago'];
function mfRank(name){ const n=nrm(name); for(let i=0;i<MF_ORDER.length;i++){ const k=nrm(MF_ORDER[i]); if(n===k||n.startsWith(k)) return i; } return MF_ORDER.length; }
function findTax(mf){ const n=nrm(mf); return TAXONOMY.find(t=>{const k=nrm(t.mf);return n===k||n.startsWith(k);}); }
function masteryTree(){
  const agg={};
  for(const u of state.units){
    const c=classifyUnit(u), sc=unitMastery(u).score||0;
    const M=agg[c.mf]||(agg[c.mf]={br:{}});
    const B=M.br[c.brand]||(M.br[c.brand]={ln:{}});
    const L=B.ln[c.line]||(B.ln[c.line]={sum:0,n:0,mastered:0});
    L.sum+=sc; L.n++; if(sc>=81) L.mastered++;
  }
  const out=[];
  for(const mf of Object.keys(agg).sort((a,b)=>mfRank(a)-mfRank(b)||a.localeCompare(b))){
    if(!agg[mf]) continue;
    const tax=findTax(mf), brAgg=agg[mf].br;
    let mfSum=0,mfN=0; const brands=[];
    for(const bn of orderBy(tax?tax.brands.map(b=>b.b):[], Object.keys(brAgg))){
      if(!brAgg[bn]) continue;
      const taxB=tax&&tax.brands.find(b=>b.b===bn), lnAgg=brAgg[bn].ln;
      let bSum=0,bN=0,bMast=0; const lines=[];
      for(const ln of orderBy(taxB?taxB.lines:[], Object.keys(lnAgg))){
        const o=lnAgg[ln]; if(!o) continue;
        lines.push({name:ln,pct:Math.round(o.sum/o.n),n:o.n,mastered:o.mastered});
        bSum+=o.sum; bN+=o.n; bMast+=o.mastered;
      }
      brands.push({name:bn,pct:bN?Math.round(bSum/bN):0,n:bN,mastered:bMast,lines});
      mfSum+=bSum; mfN+=bN;
    }
    out.push({name:mf,pct:mfN?Math.round(mfSum/mfN):0,n:mfN,brands});
  }
  return out;
}
function lineComplete(m,b,l){
  if(l.n<=0) return true;
  const earned=(state.progress&&state.progress.badges)||{};
  const lk=m.name+'|'+b.name+'|'+l.name;
  if(b.lines.length>1) return !!earned['line:'+lk] || l.mastered>=l.n;        // multi-line: line achievement (3 perfect drills) or all models mastered
  return !!earned['brand:'+m.name+'|'+b.name] || l.mastered>=l.n;             // single-line brand: brand achievement (all models mastered)
}
function focusNext(tree){
  for(const m of tree) for(const b of m.brands) for(const l of b.lines){ if(!lineComplete(m,b,l)) return {mf:m.name,brand:b.name,line:l.name,pct:l.pct}; }
  return null;
}
function focusScopeStr(focus){
  const u=state.units.find(x=>{const c=classifyUnit(x); return c.mf===focus.mf&&c.brand===focus.brand&&c.line===focus.line;});
  // scope on the CLASSIFIED line, not the raw productLine text: lines that share a
  // product-line string (e.g. Reflection fifth wheels vs travel trailers) must not mix
  return u? 'taxline:'+focus.mf+'|'+focus.brand+'|'+focus.line : 'due';

/* ---------- Proficiency achievements ---------- */
const DRILLS_NEEDED=3;
const lineKeyOf = c => c.mf+'|'+c.brand+'|'+c.line;
// after a session, +1 drill for every product line the session covered ENTIRELY with 100% accuracy
function recordSessionDrills(correctSet,wrongSet){
  ensureProgress();
  const byLine={};
  for(const u of state.units){ const k=lineKeyOf(classifyUnit(u)); (byLine[k]||(byLine[k]=[])).push(u.id); }
  for(const k in byLine){
    const ids=byLine[k];
    const perfect = ids.length>0 && ids.every(id=>correctSet.has(id)) && ids.every(id=>!wrongSet.has(id));
    if(perfect) state.progress.lineDrills[k]=(state.progress.lineDrills[k]||0)+1;
  }
}
// award line + brand achievements; returns newly-earned for toasting
function evalProficiency(){
  ensureProgress();
  const tree=masteryTree(), earned=state.progress.badges, dr=state.progress.lineDrills, newly=[];
  for(const m of tree) for(const b of m.brands){
    const bkey='brand:'+m.name+'|'+b.name;
    if(b.lines.length>1){
      let all=true;
      for(const l of b.lines){
        const lk=m.name+'|'+b.name+'|'+l.name, id='line:'+lk;
        if((dr[lk]||0)>=DRILLS_NEEDED){ if(!earned[id]){ earned[id]=Date.now(); newly.push({label:l.name}); } }
        else all=false;
      }
      if(all && !earned[bkey]){ earned[bkey]=Date.now(); newly.push({label:m.name+' '+b.name}); }
    } else {
      // single-line brand: brand badge once every model is mastered
      if(b.n>0 && b.mastered===b.n && !earned[bkey]){ earned[bkey]=Date.now(); newly.push({label:m.name+' '+b.name}); }
    }
  }
  return newly;
}
function proficiencyHtml(){
  ensureProgress();
  const tree=masteryTree(), earned=state.progress.badges, dr=state.progress.lineDrills;
  let out='';
  for(const m of tree) for(const b of m.brands){
    const bkey='brand:'+m.name+'|'+b.name, bOn=!!earned[bkey];

    if(b.lines.length>1){

        return `<span class="prof-chip ${on?'on':''}">${esc(l.name)} <b>${on?'✓':n+'/'+DRILLS_NEEDED}</b></span>`;
      }).join('');
    } else {

    }

/* ---------- Dashboard: unified action queue + readiness ring ----------
   Replaces the old separate Weak/Due tabs and the expandable mastery tree:
   one ordered list (due soonest first, then weakest-not-due) drives both the
   glanceable queue on the dashboard and the "Start Quick Session" button. */
function actionQueueUnits(){
  const now=Date.now();
  const due=state.units.filter(u=>isReviewDue(u.srs,now)).sort((a,b)=>a.srs.due-b.srs.due);
  const dueIds=new Set(due.map(u=>u.id));
  const weak=state.units.filter(u=>u.srs.reviews>0 && !dueIds.has(u.id))
    .map(u=>({u,m:masteryScore(u.srs),lap:u.srs.lapses||0}))
    .filter(x=>x.m<0.6||x.lap>=2)
    .sort((a,b)=>a.m-b.m||b.lap-a.lap)
    .map(x=>x.u);
  return due.concat(weak);   // priority order: due soonest, then weakest — not shuffled
}

  if(!qlen) return "You're all caught up — nothing urgent right now.";

  if(budgetKey==='full'){
    if(dueCount<=0) return `Got a few minutes? Sharpen ${qlen} weak floorplan${qlen!==1?'s':''}.`;
    const w=qlen-dueCount;
    return w>0 ? `Got a few minutes? Clear ${dueCount} due and sharpen ${w} weak floorplan${w!==1?'s':''}.`
               : `Got a few minutes? Clear all ${dueCount} due floorplan${dueCount!==1?'s':''}.`;

  const n=Math.min(qlen,b.n), nDue=Math.min(n,dueCount), nWeak=n-nDue;
  if(nWeak<=0) return `Got ${b.label}? Master ${n} due floorplan${n!==1?'s':''}.`;
  if(nDue<=0) return `Got ${b.label}? Sharpen ${n} weak floorplan${n!==1?'s':''}.`;
  return `Got ${b.label}? Clear ${nDue} due and sharpen ${nWeak} weak floorplan${nWeak!==1?'s':''}.`;

let session=null;
/* ---------- Adaptive study session ----------
   Builds a mixed queue: low-mastery items as multiple choice (recognition),
   mid-mastery as flashcards (active recall), high-mastery bundled into 4-item
   speed-matching rounds every 4-5 individual cards. Reuses the existing
   stageFlashOrQuiz/stageChoice renderers and schedule()/recordAnswer() engine
   as-is — only session advancement (adaptiveRate/adaptiveMatchCheck) is new,
   so the classic dedicated-mode fallback below is completely untouched. */
function adaptiveTier(u){ const s=unitMastery(u).score; return s>=80?'high':(s>=41?'mid':'low'); }
function adaptivePool(scope){
  let pool=state.units.slice();
  if(scope.startsWith('mfg:')) pool=pool.filter(u=>classifyUnit(u).mf===scope.slice(4));
  else if(scope.startsWith('line:')) pool=pool.filter(u=>u.productLine===scope.slice(5));
  else if(scope.startsWith('cat:')) pool=pool.filter(u=>(u.tags||[]).includes(scope.slice(4)));
  return pool;
}
// Picks up to n items from an already-priority-sorted pool, round-robining across
// groups (brand by default) so a single dominant group can't fill the whole
// selection just because its items happen to sort first — each group's own internal
// priority order is preserved, only the INTERLEAVING across groups is added.
function pickDiversified(pool,n,groupFn){
  groupFn=groupFn||(u=>classifyUnit(u).brand);
  if(n<=0) return [];
  const groups=new Map();
  for(const u of pool){ const b=groupFn(u); if(!groups.has(b)) groups.set(b,[]); groups.get(b).push(u); }
  const order=[...groups.keys()];
  const picked=[]; let i=0;
  while(picked.length<n && order.some(b=>groups.get(b).length)){
    const b=order[i%order.length]; const g=groups.get(b);
    if(g.length) picked.push(g.shift());
    i++;
  }
  return picked;
}
// Reorders a unit list so the same brand never appears more than maxRun times in a
// row, without discarding anything — at each step, greedily prefers whichever brand
// still has the most units left (spreads large groups out early) while respecting
// the run cap, only allowing a repeat if literally nothing else remains.
function interleaveByBrand(units,maxRun){
  const groups=new Map();
  for(const u of units){ const b=classifyUnit(u).brand; if(!groups.has(b)) groups.set(b,[]); groups.get(b).push(u); }
  const result=[]; let lastBrand=null, run=0;
  while(result.length<units.length){
    const candidates=[...groups.entries()].filter(([,list])=>list.length>0).sort((a,b)=>b[1].length-a[1].length);
    if(!candidates.length) break;
    const choice=candidates.find(([b])=>!(b===lastBrand&&run>=maxRun))||candidates[0];
    const [b,list]=choice;
    result.push(list.shift());
    if(b===lastBrand) run++; else { lastBrand=b; run=1; }
  }
  return result;
}
function buildAdaptiveUnits(scope,length){
  const now=Date.now();
  const pool=adaptivePool(scope);
  const due=pool.filter(u=>isReviewDue(u.srs,now)).sort((a,b)=>a.srs.due-b.srs.due);
  const fresh=pool.filter(u=>isNew(u.srs));
  const freshIds=new Set(fresh.map(u=>u.id)), dueIds=new Set(due.map(u=>u.id));
  const weak=pool.filter(u=>!dueIds.has(u.id)&&!freshIds.has(u.id)).sort((a,b)=>unitMastery(a).score-unitMastery(b).score);

  if(!length) return interleaveByBrand(due.concat(weak,fresh),2);   // "full" scope: everything, just brand-safe ordered

  const freshQuota=Math.round(length*0.25);   // ~20-30% new-exposure, matches spec
  const freshPicks=pickDiversified(fresh,Math.min(freshQuota,fresh.length));
  const reviewPicks=pickDiversified(due.concat(weak),length-freshPicks.length);
  let combined=reviewPicks.concat(freshPicks);
  if(combined.length<length){   // small inventory/scope: top up from whatever's left rather than shortchange the session
    const used=new Set(combined.map(u=>u.id));
    combined=combined.concat(pool.filter(u=>!used.has(u.id)).slice(0,length-combined.length));
  }
  return interleaveByBrand(combined,2);

function buildAdaptiveSteps(units){
  const high=units.filter(u=>adaptiveTier(u)==='high').map(u=>u.id);
  const individual=units.filter(u=>adaptiveTier(u)!=='high');
  const steps=[]; const hi=high.slice(); let sinceRound=0;
  for(const u of individual){
    steps.push({kind:'card', id:u.id, presentation: adaptiveTier(u)==='low'?'mc':'flashcard'});
    sinceRound++;
    if(sinceRound>=4 && hi.length>=4){ steps.push({kind:'match', ids:hi.splice(0,4)}); sinceRound=0; }
  }
  while(hi.length>=4) steps.push({kind:'match', ids:hi.splice(0,4)});      // trailing full round(s)
  for(const id of hi) steps.push({kind:'card', id, presentation:'flashcard'}); // <4 leftover: review individually

function buildQueue(scope){
  const now=Date.now();
  let pool=state.units.slice();
  if(scope==='queue') return actionQueueUnits().map(u=>u.id);   // dashboard: due-first-then-weakest, priority order (not shuffled)
  if(scope==='weak') pool=pool.filter(u=>isWeak(u.srs));
  else if(scope.startsWith('mfg:')) pool=pool.filter(u=>classifyUnit(u).mf===scope.slice(4));
  else if(scope.startsWith('taxline:')) { const t=taxlineParts(scope); pool=pool.filter(u=>matchesTaxline(u,t)); }
  else if(scope.startsWith('line:')) pool=pool.filter(u=>u.productLine===scope.slice(5));
  else if(scope.startsWith('cat:')) pool=pool.filter(u=>(u.tags||[]).includes(scope.slice(4)));
  if(scope==='due'){
    const rev=pool.filter(u=>isReviewDue(u.srs,now)).sort((a,b)=>a.srs.due-b.srs.due);
    const nw=pool.filter(u=>isNew(u.srs)).slice(0,state.settings.newLimit||20);
    return shuffle(rev).concat(shuffle(nw)).map(u=>u.id);
  }
  // practice scopes: everything in pool, due first
  return shuffle(pool).sort((a,b)=> (isReviewDue(b.srs,now)?1:0)-(isReviewDue(a.srs,now)?1:0)).map(u=>u.id);
}

function adaptiveMatchPick(mid){

function adaptiveMatchAssign(imgId){

function reveal(){ session.revealed=true; render(); }
/* ---- gesture-driven rating for adaptive flashcard steps ----
   Right swipe -> easy (Got it), left swipe -> again (WRONG), up swipe -> good
   (Fair). "Needs Work" has no swipe of its own — reachable via the button row,
   which always stays visible as the tap fallback. Rebound every render since
   the .flashcard element is recreated each time. Drag-follow is a direct 1:1
   reflection of the rep's own finger, not autonomous animation, so it plays
   regardless of reduced-motion preference; the fling-off and its rating delay
   are skipped under reduced motion, rating immediately instead. */
function wireAdaptiveSwipe(){
  const card=document.querySelector('.flashcard'); if(!card) return;
  const step=session.steps&&session.steps[session.pos];
  if(!step || step.kind!=='card' || step.presentation!=='flashcard' || !session.revealed) return;
  let sx=0,sy=0,dragging=false;
  card.ontouchstart=e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; dragging=true; card.style.transition=''; card.classList.add('swiping'); };
  card.ontouchmove=e=>{
    if(!dragging) return; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    card.classList.remove('swipe-r','swipe-l','swipe-u');
    if(Math.abs(dx)>24 && Math.abs(dx)>Math.abs(dy)*1.3) card.classList.add(dx>0?'swipe-r':'swipe-l');
    else if(dy<-24 && Math.abs(dy)>Math.abs(dx)*1.3) card.classList.add('swipe-u');
    const rot=Math.max(-12,Math.min(12,dx/12));
    card.style.transform=`translate(${dx}px,${Math.min(0,dy)}px) rotate(${rot}deg)`;
  };
  card.ontouchend=e=>{
    if(!dragging) return; dragging=false; card.classList.remove('swiping');
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    card.classList.remove('swipe-r','swipe-l','swipe-u');
    const isRight=Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.3 && dx>0;
    const isLeft=Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.3 && dx<0;
    const isUp=dy<-60 && Math.abs(dy)>Math.abs(dx)*1.3;
    if(isRight||isLeft||isUp){
      const rating=isRight?'easy':isLeft?'again':'good';
      if(prefersReduced()){ card.style.transform=''; adaptiveRate(rating); return; }
      const flyX=isRight?window.innerWidth:isLeft?-window.innerWidth:dx, flyY=isUp?-window.innerHeight:dy;
      card.style.transition='transform .18s ease-out, opacity .18s ease-out';
      card.style.transform=`translate(${flyX}px,${flyY}px) rotate(${flyX/12}deg)`;
      card.style.opacity='0';
      setTimeout(()=>adaptiveRate(rating),160);
    }else{
      // didn't clear the rating threshold — spring back to center
      card.style.transition=prefersReduced()?'':'transform .25s cubic-bezier(.34,1.56,.64,1)';
      card.style.transform='';
    }
  };
}
function pick(id){ if(session.answered) return; triggerHaptic('light'); session._picked=id; session.answered=true; render(); }
// Real Vibration API, safely guarded — but iOS Safari/WebKit has never implemented

// group filtered units: manufacturer -> brand -> line, in mastery-priority order
function browseGroups(list){

      const lines=[];

      if(lines.length) brands.push({name:b.name,pct:b.pct,lines,n:lines.reduce((s,l)=>s+l.units.length,0)});

/* ---------- Remote progress sync ----------
   Field-mapped explicitly rather than dumping objects wholesale, since the local
   SM-2/mastery shape and the DB row shape don't match 1:1 (different names, and
   epoch-ms locally vs ISO timestamps remotely). `history` and `mastery.level` are
   deliberately not synced: history is a local-only diagnostic log nothing reads
   for scheduling, and level is always cheaply re-derivable from a synced score. */
function srsToRow(u){
  const c=u.srs, m=u.mastery||{};
  return {
    user_id:authUser.id, unit_id:u.id,
    repetitions:c.reps||0, interval:c.interval||0, ease_factor:c.ease||2.5,
    next_review_date:c.due?new Date(c.due).toISOString():null,
    reviews:c.reviews||0, lapses:c.lapses||0,
    mastery_score:m.score||0, ever_mastered:!!m.everMastered,
    last_reviewed_at:c.lastReviewed?new Date(c.lastReviewed).toISOString():null,
    updated_at:new Date(c.updatedAt||Date.now()).toISOString(),
  };
}
// Merges a remote row onto a unit's *existing* local srs/mastery objects (rather
// than replacing them outright) so local-only fields like `history` survive, and
// only applies it at all if the remote copy is actually newer than what's already
// here — protects a rep's just-completed offline reviews from being clobbered by
// a pull that runs before they've had a chance to push.
function applyRemoteRow(u,row){
  const localUpdated=u.srs.updatedAt||0;
  const remoteUpdated=row.updated_at?new Date(row.updated_at).getTime():0;
  if(u.srs.reviews>0 && remoteUpdated<=localUpdated) return false;   // local is newer or equal — keep it
  Object.assign(u.srs,{
    reps:row.repetitions||0, interval:row.interval||0, ease:row.ease_factor||2.5,
    due:row.next_review_date?new Date(row.next_review_date).getTime():Date.now(),
    reviews:row.reviews||0, lapses:row.lapses||0,
    lastReviewed:row.last_reviewed_at?new Date(row.last_reviewed_at).getTime():null,
    updatedAt:remoteUpdated||Date.now(),
  });
  const score=row.mastery_score||0;
  u.mastery={score, level:masteryLevelFor(score), everMastered:!!row.ever_mastered};
  return true;
}
/* ---------- Pitch & Feature drill: local progress + sync mapping ----------
   Stored separately from state.units entirely — NOT shoehorned into the floorplan
   array, which every Browse/Dashboard/mastery function assumes holds real units.
   Reuses the existing user_unit_progress table via a synthetic "feature:" unit_id
   prefix rather than a new table (no schema migration) — but push/pull genuinely
   need to know about this second data domain; that part isn't free, just the
   schema change is avoided. */
function featureProgress(key){ return (state.featureProgress&&state.featureProgress[key]) || {correct:0,tier:0,updatedAt:0}; }
// Scripts/features need 2 consecutive correct to reach Mastered; official Alliance
// training questions need 3 — this is the single source of truth both recordFeatureAnswer
// and the remote-pull reconstruction read from, so the two can never drift apart.
function featureMasteryThreshold(key){
  const item=allFeatureItems().find(i=>i.key===key);
  return (item&&item.type==='question') ? 3 : 2;
}
function tierForCorrectCount(correct,threshold){ return correct<=0?0:(correct>=threshold?2:1); }
function recordFeatureAnswer(key,wasCorrect){
  state.featureProgress=state.featureProgress||{};
  const threshold=featureMasteryThreshold(key);
  const p=state.featureProgress[key]||{correct:0,tier:0,updatedAt:0};
  p.correct=wasCorrect?p.correct+1:0;
  p.tier=tierForCorrectCount(p.correct,threshold);   // normalized 0=Unseen/1=Learning/2=Mastered — independent of the raw count now that thresholds differ by item type
  p.updatedAt=Date.now();
  state.featureProgress[key]=p;
  saveState();
}
function featureProgressToRow(key){
  const p=featureProgress(key);
  return { user_id:authUser.id, unit_id:'feature:'+key, repetitions:p.correct,
    mastery_score:p.tier===2?100:(p.tier===1?50:0), updated_at:new Date(p.updatedAt||Date.now()).toISOString() };
}

  if(!supabaseClient||!authUser) return;
  try{
    const {data,error}=await supabaseClient.from('user_unit_progress').select('*').eq('user_id',authUser.id);
    if(error) throw error;
    const byUnit=new Map(), byFeature=new Map();
    for(const row of (data||[])){
      if(String(row.unit_id).startsWith('feature:')) byFeature.set(row.unit_id.slice(8),row);
      else byUnit.set(row.unit_id,row);
    }
    let changed=false;
    for(const u of state.units){
      const row=byUnit.get(u.id); if(!row) continue;
      if(applyRemoteRow(u,row)) changed=true;
    }
    state.featureProgress=state.featureProgress||{};
    for(const [key,row] of byFeature){
      const local=state.featureProgress[key];
      const remoteUpdated=row.updated_at?new Date(row.updated_at).getTime():0;
      if(local && local.updatedAt && remoteUpdated<=local.updatedAt) continue;   // local is newer — same protection applyRemoteRow gives units
      const correct=row.repetitions||0;
      state.featureProgress[key]={correct, tier:tierForCorrectCount(correct,featureMasteryThreshold(key)), updatedAt:remoteUpdated||Date.now()};
      changed=true;
    }
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',authUser.id).maybeSingle();
    if(profile){
      state.progress=state.progress||{};
      state.progress.streak=state.progress.streak||{};
      state.progress.streak.current=profile.streak_count||0;
      if(profile.badges) state.progress.badges=Object.fromEntries((profile.badges||[]).map(b=>[b,true]));
      changed=true;
    }
    if(changed) saveState();
  }catch(_){ /* offline or backend unreachable — local data stays authoritative, nothing lost */ }
}
let remoteSyncStatus={ lastPushAt:null, lastError:null, pushing:false };
function pendingSyncCount(){
  // "pending" = reviewed units whose local edit is newer than our last confirmed
  // push. Deliberately not a per-record flag: every push already re-sends the full
  // reviewed set (upsert is idempotent), so comparing against lastPushAt is enough
  // to know what a retry still needs to cover, without extra bookkeeping per unit.
  if(!supabaseClient||!authUser) return 0;
  const since=remoteSyncStatus.lastPushAt||0;
  const unitsPending=state.units.filter(u=>u.srs.reviews>0 && (u.srs.updatedAt||0)>since).length;
  const featurePending=Object.values(state.featureProgress||{}).filter(p=>(p.updatedAt||0)>since).length;
  return unitsPending+featurePending;
}
// Stays hidden whenever there's nothing worth a rep's attention (signed out, or
// signed in and fully synced) — only appears for syncing/pending/offline/error,
// so it doesn't become permanent visual clutter in the topbar for the common case.
function updateSyncPill(){
  const el=$('#syncPill'); if(!el) return;
  if(!supabaseClient||!authUser){ el.style.display='none'; return; }
  const pending=pendingSyncCount();
  el.style.display='';
  if(remoteSyncStatus.pushing){ el.className='sync-pill syncing'; el.textContent='Syncing…'; }
  else if(!navigator.onLine && pending>0){ el.className='sync-pill offline'; el.textContent=`Offline · ${pending} pending`; }
  else if(pending>0){ el.className='sync-pill pending'; el.textContent=`${pending} pending`; }
  else if(remoteSyncStatus.lastError){ el.className='sync-pill error'; el.textContent='Sync error'; }
  else { el.style.display='none'; }
}
async function pushLocalToRemote(){
  if(!supabaseClient||!authUser) return;
  remoteSyncStatus.pushing=true; updateSyncPill();
  try{
    const rows=state.units.filter(u=>u.srs.reviews>0).map(srsToRow);
    const featureRows=Object.keys(state.featureProgress||{}).map(featureProgressToRow);
    const allRows=rows.concat(featureRows);
    if(allRows.length) await supabaseClient.from('user_unit_progress').upsert(allRows);
    await supabaseClient.from('profiles').upsert({
      id:authUser.id,
      streak_count:(state.progress&&state.progress.streak&&state.progress.streak.current)||0,
      badges:Object.keys((state.progress&&state.progress.badges)||{}),
      updated_at:new Date().toISOString(),
    });
    remoteSyncStatus.lastPushAt=Date.now(); remoteSyncStatus.lastError=null;
  }catch(err){ remoteSyncStatus.lastError=(err&&err.message)||'Sync failed'; /* nothing surfaced mid-study — the pill covers it */ }
  remoteSyncStatus.pushing=false; updateSyncPill();
  if(route==='settings') render();
}
let pushTimer=null;
function debouncedPushToRemote(){
  if(!supabaseClient||!authUser) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushLocalToRemote,2000);
  updateSyncPill();   // reflect the new pending count immediately, don't wait for the debounce
}
// Push retries on its own next time saveState() runs, but a rep who reconnects and
// then just sits on the dashboard without reviewing anything else would otherwise
// wait indefinitely — this flushes proactively the moment connectivity returns.
window.addEventListener('online',()=>{ if(supabaseClient&&authUser) pushLocalToRemote(); });
window.addEventListener('offline',updateSyncPill);
// Wired once at boot: keeps authUser current across sign-in/out and across a PWA
// relaunch from the home screen (Supabase persists the session in local storage
// and this fires with the restored session as soon as it's checked).
// A rep may have studied plenty on this device before ever creating an account.
// Stage 2's push already sends a full snapshot every time (not incremental diffs),
// so that history isn't actually at risk of being lost — it would sync on the next
// natural review regardless. The real gap this closes: if they sign up but don't
// happen to study again right away, it sits unpushed indefinitely and looks
// "missing" from any other device until then. This surfaces it immediately instead
// of leaving it to chance, and — since a shared/demo device could have someone
// else's local history sitting on it — asks first rather than merging silently.
function hasUnclaimedLocalProgress(){
  if(!supabaseClient||!authUser) return false;
  if(state.settings&&state.settings.migrationHandled) return false;
  return pendingSyncCount()>0;
}
function showMigrationPrompt(){
  const n=pendingSyncCount();
  $('#modalBox').innerHTML=`<div class="modal-body">
    <h2 style="font-size:19px;margin-bottom:2px">Add your existing progress?</h2>
    <p class="muted" style="font-size:13.5px">This device already has study history on ${n} floorplan${n!==1?'s':''} from before you signed in. Add it to <b>${esc(authUser.email||'this account')}</b> so it follows you to other devices too?</p>
    <div class="flex wrap" style="gap:9px;margin-top:14px">
      <button class="btn btn-primary" onclick="confirmMigration(this)">${svg(I.check)} Yes, it's mine</button>
      <button class="btn" onclick="dismissMigration()">Not now</button>
    </div>
  </div>`;
  $('#modalBack').classList.add('show');
}
async function confirmMigration(btn){
  if(btn) btn.disabled=true;
  await pushLocalToRemote();
  state.settings=state.settings||{}; state.settings.migrationHandled=true;
  saveState();
  $('#modalBack').classList.remove('show');
  toast('Progress added to your account','ok');
}
function dismissMigration(){
  state.settings=state.settings||{}; state.settings.migrationHandled=true;
  saveState();
  $('#modalBack').classList.remove('show');
}
function wireAuthListener(){
  if(!supabaseClient) return;
  supabaseClient.auth.onAuthStateChange((_event,session)=>{
    const wasSignedOut=!authUser;
    authUser=session?session.user:null;
    authReady=true;
    updateSyncPill();
    if(authUser && wasSignedOut) pullRemoteToLocal().then(()=>{
      if(route==='settings'||route==='dashboard') render();
      if(hasUnclaimedLocalProgress()) showMigrationPrompt();
    });
    if(route==='settings') render();
  });
}

// Purely cosmetic entrance, floored at 1.3s — right when the last blueprint line and
// title fade begin — so the 0.6s exit transition overlaps their tail end instead of
// stacking after it (full content sequence alone runs to ~1.7s; this keeps the total
// closer to 1.9s than the ~2.3s a strictly-sequential dismissal would produce). Still
// never gated on anything beyond render() itself already being ready. Under reduced
// motion, skips the cosmetic floor entirely, matching prefersReduced() everywhere else.
function hideSplash(){
  const el=document.getElementById('app-splash'); if(!el) return;
  const minDelay=prefersReduced()?0:1300;
  setTimeout(()=>{ el.classList.add('fade-out'); setTimeout(()=>el.remove(),600); },minDelay);
}
(async function(){
  await openDB();
  await loadState();
  ensureProgress();
  applyTheme();
  wireGlobal();
  render();                 // instant render from whatever's already in IndexedDB (empty on a device that's never synced)
  hideSplash();              // real content is up as of the line above — nothing further to wait on but the splash's own short cosmetic pacing
  wireAuthListener();        // auth/session check — non-blocking
  // Auth (session restore) typically resolves much faster than the inventory fetch,
  // so a sign-in-triggered pull can easily run before state.units is populated —
  // with nothing to merge remote progress into, that pull is a silent no-op that
  // never gets retried. Re-running the pull once inventory has actually settled
  // closes that gap regardless of which of the two finishes first.
  syncInventory().then(()=>{ if(authUser) pullRemoteToLocal().then(()=>{ if(route==='dashboard'||route==='settings') render(); }); });
})();
