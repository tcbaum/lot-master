<style>
:root{
  color-scheme:light;
  /* Clear Creek RVs — navy primary, gold accent, clean dealership system */
  --primary:#0F4C81; --primary-dark:#0A2F52; --secondary:#2C6AA0;
  --accent:#F4B400; --accent-light:#FFD24D; --success:#4CAF50;
  /* mapped onto existing component token names */
  --ink:#0A2F52; --ink-2:#0F4C81; --ink-3:#14598F;
  --page:#F5F7FA; --card:#FFFFFF; --card-2:#EDF1F6;
  --brand:#0F4C81; --brand-deep:#0A2F52; --brand-soft:#E7EEF5;
  --xp-from:#F4B400; --xp-to:#FFD24D;
  --mint:#4CAF50; --mint-soft:#E6F4E7;
  --amber:#F4B400; --amber-soft:#FCF1CF;
  --clay:#E5484D; --clay-soft:#FBE3E3;
  --sky:#2C6AA0; --sky-soft:#E7EFF6;
  --line:#DDE3EA; --line-2:#E6EBF1;
  --text:#2B2F33; --muted:#6B7280; --faint:#9AA3AF;
  --radius:12px; --radius-sm:10px; --radius-lg:16px;
  --shadow:0 2px 10px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --glow:0 6px 16px rgba(10,47,82,.16);
  --glass-hi:rgba(255,255,255,.5); --glass-blur:14px;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --display:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#06121E; --ink-2:#0A2F52; --ink-3:#0F4C81;
  --page:#0B1620; --card:#13212E; --card-2:#1B2C3A;
  --brand:#3E86C9; --brand-deep:#7FB4E0; --brand-soft:#15293A;
  --glass-hi:rgba(255,255,255,.06);
  --xp-from:#F4B400; --xp-to:#FFD24D;
  --mint:#5CC264; --mint-soft:#15301A;
  --amber:#FFC93C; --amber-soft:#33290F;
  --clay:#F87171; --clay-soft:#33191B;
  --sky:#5AA9DD; --sky-soft:#13293A;
  --line:#243440; --line-2:#2F4050;
  --text:#E9EEF3; --muted:#9DA8B4; --faint:#6C7884;
  --shadow:0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 10px 28px rgba(0,0,0,.5);
  --glow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--page);overscroll-behavior:none;height:100%;touch-action:pan-y}
body{
  font-family:var(--sans); color:var(--text); background:var(--page);
  -webkit-font-smoothing:antialiased; line-height:1.5; font-size:16px;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:700; line-height:1.2; margin:0; letter-spacing:-.01em}
/* ---------- Boot splash: cosmetic entrance only, never gates real readiness ----------
   Content sequence runs to ~1.7s on its own (frame draw+fill, staggered blueprint
   lines, title fade), but the .fade-out dismissal is triggered at 1.3s rather than
   after the tail end finishes — its 0.6s exit overlaps the last blueprint line and
   title still settling in, landing the whole thing around ~1.9s instead of stacking
   sequentially to ~2.3s. Real content is already correct underneath the whole time;
   this never determines when the app is actually usable. */
.splash-container{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0a111a}
.splash-container.fade-out{transition:opacity .6s ease,visibility .6s ease;opacity:0;visibility:hidden;pointer-events:none}
.splash-container .logo-wrapper{width:min(50vw,200px)}
.splash-container .lm-svg{display:block}
.splash-container .frame-path{stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1800;stroke-dashoffset:1800;fill:transparent;
  animation:splash-draw-frame 1.1s cubic-bezier(.4,0,.2,1) forwards, splash-fill-frame .35s ease forwards 1.1s}
.splash-container .blue-line{transform-origin:left center;transform:scaleX(0);opacity:0;animation:splash-draw-line .3s ease-out forwards}
.splash-container .line-1{animation-delay:.7s} .splash-container .line-2{animation-delay:.85s}
.splash-container .line-3{animation-delay:1s} .splash-container .line-4{animation-delay:1.15s}
.splash-container .line-5{animation-delay:1.3s}
.splash-container .splash-footer{opacity:0;animation:splash-fade-in .4s ease-out forwards;animation-delay:1.3s}
.splash-container .app-title{font-family:var(--display);font-weight:700;letter-spacing:.14em;color:#fff;font-size:15px;text-transform:uppercase}
@keyframes splash-draw-frame{to{stroke-dashoffset:0}}
@keyframes splash-fill-frame{to{fill:#1a365d}}
@keyframes splash-draw-line{to{transform:scaleX(1);opacity:1}}
@keyframes splash-fade-in{to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .splash-container .frame-path,.splash-container .blue-line,.splash-container .splash-footer{animation:none!important;stroke-dashoffset:0!important;fill:#1a365d!important;transform:scaleX(1)!important;opacity:1!important}
}
h1{font-size:36px} h2{font-size:28px} h3{font-size:22px;font-weight:600} h4{font-size:18px;font-weight:600}
.small{font-size:14px}
button{font-family:inherit; cursor:pointer; color:inherit}
button:active{opacity:.72}
.weak-row:active{opacity:.72}
input,select,textarea{font-family:inherit; font-size:15px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:var(--radius)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,76,129,.15)}
option{background:var(--card); color:var(--text)}
::placeholder{color:var(--faint); opacity:1}
a{color:var(--brand-deep)}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--display); font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:flex; min-height:100vh; background:var(--page)}
.sidebar{
  width:236px; flex:none; background:var(--ink); color:#dde5ee;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  padding:22px 16px; gap:6px;
}
.brand{display:flex; align-items:center; gap:11px; padding:4px 8px 18px}
.brand-mark{display:grid;place-items:center;flex:none;color:#fff}
.brand-mark svg{height:30px;width:auto;display:block}
.topbar .brand-mark{color:var(--text)}
.brand-name{font-family:var(--display);font-weight:700;font-size:16px;color:#fff;line-height:1.05;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:#8fa1b6;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;
  color:#c2d0de;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .2s ease,color .2s ease;-webkit-tap-highlight-color:transparent;user-select:none;
}
.nav-btn:active{transform:scale(.96)}
.nav-btn svg{width:19px;height:19px;flex:none;opacity:.85}
.nav-btn:hover{background:var(--ink-2);color:var(--accent-light)}
.nav-btn.active{background:var(--brand);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav-btn.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--amber);color:#3a2606;font-size:11.5px;font-weight:700;
  padding:1px 8px;border-radius:20px;min-width:20px;text-align:center;font-family:var(--display)}
.nav-spacer{flex:1}
.side-foot{font-size:11px;color:#7d90a4;padding:10px 10px 0;border-top:1px solid #29394f;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.view{padding:30px 34px 60px;max-width:1280px;width:100%;margin:0 auto;flex:1}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.view-head .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-deep);font-weight:600;margin-bottom:6px}
.view-head h1{font-size:27px}
.view-head p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:60ch}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  color:var(--brand-deep);padding:10px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;transition:transform .15s cubic-bezier(.4,0,.2,1),border-color .2s ease,background-color .2s ease,box-shadow .2s ease;white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:hover{border-color:var(--brand);color:var(--brand-deep)}
.btn:active{transform:scale(.96)}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--primary-dark);box-shadow:0 2px 8px rgba(244,180,0,.3);font-weight:600}
.btn-primary:hover{background:var(--accent-light);color:var(--primary-dark);border-color:transparent;transform:translateY(-1px);filter:none}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--card);border-color:var(--line)}
.btn-danger{color:var(--clay);border-color:var(--clay-soft)}
.btn-danger:hover{background:var(--clay-soft);border-color:var(--clay);color:var(--clay)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Cards / panels ---------- */
.panel{background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(140%) blur(var(--glass-blur));backdrop-filter:saturate(140%) blur(var(--glass-blur));border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--radius-lg);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.panel-pad{padding:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:15.5px}
.panel-head .sub{font-size:12.5px;color:var(--muted)}

/* ---------- Stat tiles ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.stat .label svg{width:15px;height:15px}
.stat .val{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin-top:11px;letter-spacing:-.02em}
.stat .foot{font-size:12px;color:var(--faint);margin-top:6px}
.stat.accent-brand .val{color:var(--brand-deep)} .stat.accent-amber .val{color:var(--amber)}
.stat.accent-clay .val{color:var(--clay)} .stat.accent-sky .val{color:var(--sky)}
.stat .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
.accent-brand .rail{background:var(--brand)} .accent-amber .rail{background:var(--amber)}
.accent-clay .rail{background:var(--clay)} .accent-sky .rail{background:var(--sky)}

.badge-device-only{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.diag-accordion{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.diag-accordion summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:12.5px;font-weight:600;color:var(--muted)}
.diag-accordion summary::-webkit-details-marker{display:none}
.diag-accordion summary:hover{color:var(--brand)}
.diag-accordion[open] summary{border-bottom:1px solid var(--line);color:var(--text)}

/* ---------- Mastery gauges ---------- */
.gauge{margin-bottom:15px}
.gauge:last-child{margin-bottom:0}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.gauge-name{font-weight:600;font-size:13.5px}
.gauge-name small{color:var(--faint);font-weight:500}
.gauge-pct{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--muted)}
.gauge-track{height:9px;background:var(--card-2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gauge-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--mint),#0d9f72);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge-fill.low{background:linear-gradient(90deg,var(--clay),#f08a8a)}
.gauge-fill.mid{background:linear-gradient(90deg,var(--amber),#f5c45a)}
.btn-sm{padding:7px 13px;font-size:13px}
/* ---- glassmorphism welcome dashboard ---- */
.glass{position:relative;border-radius:var(--radius-lg);
  background:var(--card);
  background:color-mix(in srgb,var(--card) 60%,transparent);
  -webkit-backdrop-filter:saturate(150%) blur(16px);backdrop-filter:saturate(150%) blur(16px);
  border:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-hi,rgba(255,255,255,.55));
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
html[data-theme="dark"] .glass{--glass-hi:rgba(255,255,255,.07);background:color-mix(in srgb,var(--card) 66%,transparent);border-color:color-mix(in srgb,#fff 9%,transparent)}
.glass:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(10,47,82,.20),inset 0 1px 0 var(--glass-hi,rgba(255,255,255,.6))}
.hero-glass{padding:30px 32px;overflow:hidden;margin-bottom:18px}
.hero-glass::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 150% at 0% 0%,color-mix(in srgb,var(--brand) 30%,transparent),transparent 55%),
            radial-gradient(110% 140% at 100% 10%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 52%)}
.hero-inner{position:relative;z-index:1}
.hero-glass h1{font-size:30px;line-height:1.1;margin:0 0 7px;letter-spacing:-.02em;color:var(--text)}
.glass-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.gcard{padding:22px}
.gcard-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gc-ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.gc-ic svg{width:17px;height:17px}
.gcard-head h3{font-size:15px;margin:0}
.lot-metrics{display:flex;flex-direction:column;gap:15px}
.lot-metric{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding-bottom:13px}
.lot-metric:last-child{border-bottom:0;padding-bottom:0}
.lot-metric .v{font-family:var(--display);font-weight:700;font-size:27px;line-height:1;color:var(--text)}
.lot-metric .v.c-warn{color:var(--amber)}
.lot-metric .l{font-size:13px;color:var(--muted);text-align:right}
.lp-path{display:flex;flex-direction:column;gap:3px;margin:16px 0}
.lp-path-lab{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-deep)}
.lp-path-lab svg{width:13px;height:13px}
.lp-path-name{font-size:15px;font-weight:600;color:var(--text)}
.lp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lp-chip{font-size:12px;font-weight:600;color:var(--text);background:color-mix(in srgb,var(--brand-soft) 70%,transparent);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
@media(max-width:760px){.glass-row{grid-template-columns:1fr}.hero-glass{padding:24px 20px}.hero-glass h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){.glass{transition:none}.glass:hover{transform:none}}
@media (prefers-reduced-transparency:reduce){
  .glass,.panel,.flashcard,.mode-slide,.modal,.unit-card,.inv-grid,.choice,.rate,.weak-row,.chip,.prof-chip{background:var(--card)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .hero-glass::before{display:none}
}

/* ---------- Weak list ---------- */
.weak-row{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:10px;background:color-mix(in srgb,var(--card) 45%,transparent);box-shadow:inset 0 1px 0 var(--glass-hi)}
.weak-row:last-child{margin-bottom:0}
.weak-thumb{width:54px;height:40px;border-radius:7px;background:var(--card-2);border:1px solid var(--line);flex:none;
  object-fit:contain;display:grid;place-items:center;color:var(--faint);font-size:10px;overflow:hidden}
.weak-thumb img{width:100%;height:100%;object-fit:contain}
.weak-meta{min-width:0;flex:1}
.weak-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weak-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.badge-new{background:var(--sky-soft);color:var(--sky)}
.badge-learning{background:var(--amber-soft);color:var(--amber)}
.badge-young{background:var(--card-2);color:var(--muted)}
.badge-mastered{background:var(--mint-soft);color:var(--mint)}
.badge-due{background:var(--clay-soft);color:var(--clay)}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:7px;
  background:var(--card-2);color:var(--text);border:1px solid var(--line)}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;padding:12px 14px 12px 38px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,76,129,.15)}
select.sel{padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);font-weight:500;color:var(--text)}
select.sel:focus{outline:none;border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid color-mix(in srgb,var(--line-2) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,#fff 9%,transparent),transparent 60%),color-mix(in srgb,var(--card) 60%,transparent);color:var(--text);padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600;transition:.13s;box-shadow:inset 0 1px 0 var(--glass-hi)}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- Inventory grid ---------- */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;-webkit-backdrop-filter:saturate(130%) blur(12px);backdrop-filter:saturate(130%) blur(12px);border-radius:var(--radius-lg)}
.unit-card{background:linear-gradient(180deg,color-mix(in srgb,#fff 9%,transparent),transparent 55%),color-mix(in srgb,var(--card) 72%,transparent);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);transition:transform .15s cubic-bezier(.4,0,.2,1),border-color .2s ease,box-shadow .2s ease;text-align:left;display:flex;flex-direction:column;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
.unit-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.unit-card:active{transform:scale(.96)}
.unit-fig{height:142px;background:var(--card-2);display:grid;place-items:center;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
/* Skeleton shimmer while a floorplan image is genuinely loading — driven by the
   dedicated data-loading attribute (added by ghImg, cleared by hydrateImages/
   imgFallback only once a load truly settles), not data-ghsrc, which clears
   immediately on hydration start rather than on completion. No JS class-toggling
   needed beyond that attribute lifecycle, which already exists for other reasons.
   Colors derived from the theme's own --card-2 rather than fixed values, so it
   reads correctly in both light and dark mode instead of only one. */
img[data-loading]{background:linear-gradient(90deg,var(--card-2) 25%,color-mix(in srgb,var(--card-2) 60%,#fff) 50%,var(--card-2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ img[data-loading]{animation:none;background:var(--card-2)} }
.unit-fig img{width:100%;height:100%;object-fit:contain;padding:8px}
.unit-fig .noimg{color:var(--faint);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.unit-fig .noimg svg{width:26px;height:26px;opacity:.5}
.unit-fig .corner{position:absolute;top:9px;right:9px}
.unit-body{padding:13px 14px;flex:1;display:flex;flex-direction:column;gap:7px}
.unit-mfg{font-size:11.5px;color:var(--brand-deep);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.unit-model{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--text)}
.unit-line{font-size:12.5px;color:var(--muted)}
.unit-specs{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.unit-specs b{font-family:var(--display);font-weight:600}
.unit-loc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sky);font-weight:600;margin-top:2px}
.unit-loc svg{width:14px;height:14px}
.unit-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.unit-tags .tag{font-size:10.5px;padding:2px 8px}

/* ---------- Browse: nested stack accordion (mfr -> brand -> line) ---------- */
.bsec{margin-bottom:22px}
/* ---------- Browse: drill-down slide-panel navigation ---------- */
.bcrumbs{display:flex;align-items:center;gap:2px;margin-bottom:14px;position:sticky;top:calc(var(--topbar-h,0px) + 2px);z-index:5;background:var(--bg);padding:6px 0}
.bcrumb-back{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;margin-right:6px}
.bcrumb-back svg{width:16px;height:16px}
.bcrumb-trail{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0;font-size:13px}
.bcrumb-seg{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:4px 3px;cursor:pointer;white-space:nowrap}
.bcrumb-seg:hover{color:var(--brand)}
.bcrumb-current{font-weight:700;color:var(--text);padding:4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcrumb-sep{flex:none;color:var(--faint);display:flex}
.bcrumb-sep svg{width:13px;height:13px}
#bpanel{min-height:120px}
#bpanel.banim-fwd{animation:bslideFwd .22s ease both}
#bpanel.banim-back{animation:bslideBack .22s ease both}
@keyframes bslideFwd{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes bslideBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){#bpanel.banim-fwd,#bpanel.banim-back{animation:none}}
.bnav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:640px){.bnav-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.bnav-grid{grid-template-columns:repeat(4,1fr)}}
.bnav-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:border-color .15s,transform .1s}
.bnav-card:hover{border-color:var(--brand)}
.bnav-card:active{transform:scale(.96)}
.bnav-th{width:44px;height:44px;border-radius:11px;overflow:hidden;background:var(--card-2);display:grid;place-items:center;color:var(--faint)}
.bnav-banner{width:100%;height:58px;border-radius:11px;overflow:hidden;background:var(--card-2);display:grid;place-items:center;color:var(--faint)}
.bnav-banner.mfg-logo{background:#ffffff;padding:9px 14px}
.bnav-banner.mfg-logo img.mfg-logo-img{width:100%;height:100%;object-fit:contain;display:block}
.bnav-banner.mfg-mark{background:var(--brand-soft);color:var(--brand-deep)}
.bnav-banner.mfg-mark .mfg-init{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.6px;line-height:1}
.bnav-th img{width:100%;height:100%;object-fit:cover}
.bnav-th svg{width:18px;height:18px;opacity:.6}
.bnav-th.mfg-logo{background:#ffffff;color:#961A25;padding:6px}
.bnav-th.mfg-mark{background:var(--brand-soft);color:var(--brand-deep)}
.bnav-th.mfg-mark .mfg-init{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.5px;line-height:1}
.bnav-th.mfg-logo svg{width:100%;height:100%;opacity:1;display:block}
.bnav-th.mfg-logo img.mfg-logo-img{width:100%;height:100%;object-fit:contain;display:block}
.bnav-name{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--text);line-height:1.2}
.bnav-sub{font-size:11.5px;color:var(--muted);margin-top:-4px}
.bnav-bar{display:block;width:100%;height:5px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:2px}
.bnav-bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bnav-bar i.mid{background:var(--amber)} .bnav-bar i.low{background:var(--clay)}
.bnav-pct{font-size:11px;font-weight:700;color:var(--muted)}
.bnav-list{display:flex;flex-direction:column;gap:8px}
.bnav-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer}
.bnav-row:hover{border-color:var(--brand)}
.bnav-row-th{width:42px;height:42px;flex:none;border-radius:9px;overflow:hidden;background:var(--card-2);display:grid;place-items:center;color:var(--faint)}
.bnav-row-th img{width:100%;height:100%;object-fit:cover}
.bnav-row-th svg{width:16px;height:16px;opacity:.6}
.bnav-row-meta{flex:1;min-width:0}
.bnav-row-name{display:block;font-family:var(--display);font-weight:600;font-size:14px;color:var(--text)}
.bnav-row-sub{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.bnav-row-bar{flex:none;width:56px;height:5px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bnav-row-bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bnav-row-bar i.mid{background:var(--amber)} .bnav-row-bar i.low{background:var(--clay)}
.bnav-row-cv{flex:none;color:var(--faint);display:flex}
.bnav-row-cv svg{width:16px;height:16px}
.bsearch-group{margin-bottom:22px}
.bsearch-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text);margin:0 0 11px 2px}
.bsearch-head span{font-weight:600;color:var(--muted)}
.bsearch-head::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--brand)}

/* ---------- Study ---------- */
.study-setup{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mode-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px;text-align:left;
  display:flex;gap:14px;align-items:flex-start;transition:.15s;box-shadow:var(--shadow)}
.mode-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mode-card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.mode-ic{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.mode-ic svg{width:22px;height:22px}
.mode-card h4{font-size:15.5px;margin-bottom:3px}
.mode-card p{margin:0;font-size:12.5px;color:var(--muted)}
/* ---- mode carousel ---- */
.mode-carousel-wrap{position:relative;margin-bottom:24px}
/* ---- adaptive study session ---- */
.adaptive-setup{margin-bottom:14px}
.classic-toggle{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:18px;overflow:hidden}
.classic-toggle summary{list-style:none;cursor:pointer;padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--muted)}
.classic-toggle summary::-webkit-details-marker{display:none}
.classic-toggle summary:hover{color:var(--brand)}
.classic-toggle[open] summary{border-bottom:1px solid var(--line);color:var(--text)}
.classic-body{padding:16px}
.adaptive-bar{position:relative}
.seg-track{flex:1;display:flex;gap:2px;height:7px}
.seg-track i{flex:1;display:block;border-radius:20px;background:var(--card-2);border:1px solid var(--line)}
.seg-track i.good{background:var(--success);border-color:var(--success)}
.seg-track i.ok{background:var(--accent);border-color:var(--accent)}
.seg-track i.bad{background:var(--clay);border-color:var(--clay)}
.seg-track i.cur{background:var(--brand);border-color:var(--brand)}
.combo-pill{flex:none;display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--brand-deep);background:var(--accent);border-radius:999px;padding:4px 10px 4px 8px;animation:comboPulse .3s ease}
.combo-pill svg{width:14px;height:14px}
@keyframes comboPulse{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.combo-pill{animation:none}}
.flashcard.swiping{transition:none}
.flashcard.swipe-r{box-shadow:0 0 0 3px var(--success) inset}
.flashcard.swipe-l{box-shadow:0 0 0 3px var(--clay) inset}
.flashcard.swipe-u{box-shadow:0 0 0 3px var(--accent) inset}
.adaptive-delta{font-size:15px;color:var(--text);margin-bottom:2px}
.adaptive-delta b{font-family:var(--display)}
.adaptive-delta .up{color:var(--success);font-weight:700}
.adaptive-delta .down{color:var(--clay);font-weight:700}
.mode-carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding:6px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mode-carousel::-webkit-scrollbar{display:none}
.mode-slide{flex:0 0 min(340px,82%);scroll-snap-align:center;text-align:left;display:flex;flex-direction:column;
  background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);border:2px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--radius-lg);padding:18px;cursor:pointer;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.mode-slide:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mode-slide.sel{border-color:var(--brand);box-shadow:var(--glow)}
.mode-slide .mode-ic{margin-bottom:13px}
.mode-slide h4{font-size:17px;margin:0 0 5px}
.mode-slide p{margin:0;font-size:13px;color:var(--muted);flex:1;line-height:1.45}
.mode-pick{margin-top:15px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--faint)}
.mode-slide.sel .mode-pick{color:var(--brand)}
.mode-pick svg{width:15px;height:15px}
.carousel-arrow{position:absolute;top:38%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:grid;place-items:center;z-index:5;color:var(--text);transition:.15s}
.carousel-arrow:hover{border-color:var(--brand);color:var(--brand)}
.carousel-arrow svg{width:20px;height:20px}
.carousel-arrow.prev{left:-8px} .carousel-arrow.next{right:-8px}
.carousel-dots{display:flex;justify-content:center;gap:7px;margin-top:14px}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--line-2);padding:0;border:0;transition:.2s}
.cdot.on{background:var(--brand);width:24px;border-radius:99px}
@media(max-width:640px){.carousel-arrow{display:none}.mode-slide{flex-basis:86%}}

.study-stage{max-width:680px;margin:0 auto}
.study-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.study-prog{flex:1;height:7px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.study-prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.study-counts{display:flex;gap:8px;font-size:12.5px;font-weight:600;font-family:var(--display)}
.study-counts .c-again{color:var(--clay)} .study-counts .c-rem{color:var(--muted)}

.flashcard{background:var(--card);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(140%) blur(16px);backdrop-filter:saturate(140%) blur(16px);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:18px;box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-hi);
  min-height:330px;display:flex;flex-direction:column;overflow:hidden}
/* floorplan snips vary widely, so impose no fixed box: the image fills the card
   width and keeps its own aspect ratio (height:auto), the frame grows to fit it,
   and the text flows below — whole plan always shown, never cropped or overlapping */
.fc-fig{min-height:150px;background:var(--card-2);display:grid;place-items:center;padding:14px;border-bottom:1px solid var(--line);position:relative}
.fc-fig img{display:block;width:100%;height:auto}
.fc-fig .noimg{color:var(--faint);text-align:center;font-size:13px}
.fc-fig .noimg svg{width:40px;height:40px;opacity:.4;margin-bottom:8px}
.fc-dims{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.fc-dims span{background:rgba(20,30,48,.84);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;line-height:1;letter-spacing:.02em;padding:6px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.14);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.fc-prompt{padding:18px 20px;text-align:center}
.fc-q{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.fc-a-mfg{font-size:12.5px;color:var(--brand-deep);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
.fc-a-model{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.fc-a-line{color:var(--muted);font-size:14px;margin-top:2px}
.fc-a-detail{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.fc-a-loc{margin-top:12px;display:inline-flex;align-items:center;gap:7px;background:var(--sky-soft);color:var(--sky);
  padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px}
.fc-a-loc svg{width:16px;height:16px}

/* Top features panel (line-scoped, collapsed by default) */
/* ---- detail modal: Specs / Pitch Scripts segmented control ---- */
.seg-tabs{display:flex;gap:3px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:4px;margin:14px 0}
.seg-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;background:none;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.seg-tab svg{width:15px;height:15px}
.seg-tab.active{background:var(--card);color:var(--brand-deep);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-panel{animation:segFade .18s ease}
@keyframes segFade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.seg-panel{animation:none}}
.lf-card{border:1px solid var(--line);border-radius:12px;background:var(--card-2);padding:12px 14px;margin-bottom:10px}
.lf-card:last-child{margin-bottom:0}
.lf-card-head{display:flex;align-items:flex-start;gap:9px}
.lf-card-head .lf-t{font-weight:700}
.lf{margin:2px 16px 6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--brand-soft)}
.modal-body .lf{margin:16px 0 2px}
.lf-head{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;font-weight:700;font-size:13px;color:var(--brand-deep)}
.lf-head::-webkit-details-marker{display:none}
.lf-head svg{width:15px;height:15px;flex:none}
.lf-head em{margin-left:auto;font-style:normal;font-weight:600;font-size:11.5px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.lf-head .lf-cv{margin-left:8px;color:var(--brand);transition:transform .15s}
.lf[open] .lf-head .lf-cv{transform:rotate(180deg)}
.lf-body{padding:2px 13px 12px;background:var(--card)}
.lf-intro{font-size:12.5px;font-style:italic;color:var(--muted);padding:11px 2px 4px;line-height:1.4}
.lf-cat{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-deep);margin:16px 2px 6px;padding-top:10px;border-top:1px solid var(--line)}
.lf-cat-first{margin-top:2px;padding-top:0;border-top:0}
.lf-main{min-width:0}
.lf-head-static{cursor:default}
.lf-say{display:flex;gap:7px;align-items:flex-start;margin-top:6px;padding:7px 9px;border-radius:9px;background:var(--brand-soft);color:var(--brand-deep);font-size:12.5px;line-height:1.4;font-weight:600}
.lf-say svg{width:14px;height:14px;flex:none;margin-top:2px;opacity:.85}
.lf-row{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line-2)}
.lf-row:first-child{border-top:0}
.lf-ic{flex:none;color:var(--brand);margin-top:1px}
.lf-ic svg{width:18px;height:18px}
.lf-t{font-weight:600;font-size:13.5px;color:var(--text)}
.lf-s{font-size:12.5px;color:var(--muted);margin-top:1px}

.reveal-btn{width:100%;padding:15px;border:0;border-top:1px solid var(--line);background:var(--accent);color:var(--primary-dark);
  font-family:var(--display);font-weight:700;font-size:15px}
.reveal-btn:hover{background:var(--accent-light)}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.rate{border:1px solid color-mix(in srgb,var(--line-2) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,#fff 10%,transparent),transparent 55%),color-mix(in srgb,var(--card) 62%,transparent);border-radius:11px;padding:12px 6px;text-align:center;transition:.13s;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.rate:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rate .r-lab{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.2}
.rate .r-when{font-size:11px;color:var(--faint);margin-top:2px}
.rate.again{border-color:var(--clay-soft)} .rate.again .r-lab{color:var(--clay)}
.rate.hard{border-color:var(--amber-soft)} .rate.hard .r-lab{color:var(--amber)}
.rate.good{border-color:var(--mint-soft)} .rate.good .r-lab{color:var(--mint)}
.rate.easy{border-color:var(--sky-soft)} .rate.easy .r-lab{color:var(--sky)}

.choice{display:block;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--line-2) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,#fff 10%,transparent),transparent 55%),color-mix(in srgb,var(--card) 62%,transparent);border-radius:11px;
  padding:13px 16px;margin-bottom:10px;font-size:15px;font-weight:500;transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .2s ease,box-shadow .2s ease,border-color .2s ease;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);min-height:44px;-webkit-tap-highlight-color:transparent;user-select:none}
.choice:hover{border-color:var(--brand);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.choice:active{transform:scale(.96)}
.choice.correct{border-color:var(--mint);background:var(--mint-soft);color:var(--mint);font-weight:600}
.choice.wrong{border-color:var(--clay);background:var(--clay-soft);color:var(--clay);animation:cardShake .4s ease-in-out}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){ .choice.wrong{animation:none} }
.choice.picked{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.choice.missed{border:1px dashed var(--mint);background:transparent;color:var(--mint);font-weight:600}
.choice:disabled{cursor:default}
.choice-check{display:inline-flex;width:18px;height:18px;margin-right:9px;vertical-align:-4px}
.choice-check svg{width:100%;height:100%}
.pitch-rationale{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand-deep);font-size:13px;line-height:1.45}
.pitch-rationale svg{flex:none;width:18px;height:18px;margin-top:1px}

.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:4px 0}

/* ---------- Detail modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,30,52,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:grid;
  place-items:center;padding:18px;opacity:0;pointer-events:none;transition:.18s}
.modal-back.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(150%) blur(18px);backdrop-filter:saturate(150%) blur(18px);border:1px solid color-mix(in srgb,var(--line) 50%,transparent);border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-hi);
  transform:translateY(12px);transition:.18s}
.modal-back.show .modal{transform:none}
.modal-fig{min-height:150px;background:var(--card-2);display:grid;place-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;padding:12px}
.modal-fig img{display:block;width:100%;height:auto}
.modal-fig .noimg{color:var(--faint);text-align:center;font-size:13px}
.modal-fig .noimg svg{width:38px;height:38px;opacity:.4;display:block;margin:0 auto 8px}
.modal-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;z-index:3;opacity:.94;transition:border-color .15s,color .15s}
.modal-nav:hover{border-color:var(--brand);color:var(--brand)}
.modal-nav svg{width:20px;height:20px}
.modal-nav.prev{left:10px} .modal-nav.next{right:10px}
.modal-count{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--muted);z-index:3;white-space:nowrap;max-width:78%;overflow:hidden;text-overflow:ellipsis}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;border:0;background:var(--card);color:var(--text);
  display:grid;place-items:center;box-shadow:var(--shadow)}
.modal-body{padding:20px 22px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:600}

/* ---------- Empty states / toast ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ec{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);display:grid;place-items:center;margin:0 auto 16px;color:var(--brand-deep)}
.empty .ec svg{width:30px;height:30px}
.empty h3{font-size:18px;margin-bottom:7px;color:var(--text)}
.empty p{max-width:42ch;margin:0 auto 18px}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-weight:600;font-size:14px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.22s;display:flex;align-items:center;gap:10px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--brand-deep)} #toast.warn{background:var(--clay)}

.banner{display:flex;align-items:center;gap:11px;background:var(--amber-soft);border:1px solid var(--line);border-left:4px solid var(--accent);color:var(--text);
  padding:12px 15px;border-radius:var(--radius);font-size:13.5px;margin-bottom:18px}
.banner svg{width:18px;height:18px;flex:none;color:var(--accent)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 15px;border-radius:var(--radius);font-size:14px;margin-bottom:16px;border:1px solid var(--line);color:var(--text)}
.alert-success{background:rgba(76,175,80,.1);border-left:4px solid var(--success)}
.alert-info{background:rgba(15,76,129,.08);border-left:4px solid var(--primary)}
.alert-warning{background:rgba(244,180,0,.1);border-left:4px solid var(--accent)}
.prev-table thead th,.prev-table th{background:var(--primary-dark);color:#fff;border:0}
.prev-table tbody tr:nth-child(even){background:var(--card-2)}
.prev-table tbody tr:hover{background:var(--brand-soft)}
/* ---- matching quiz ---- */
.match-imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.mslot{position:relative;display:flex;flex-direction:column;gap:0;padding:0;border:2px solid var(--line);border-radius:var(--radius);
  background:var(--card);overflow:hidden;text-align:left;transition:border-color .15s,transform .12s,box-shadow .15s}
.mslot:not(:disabled):hover{border-color:var(--brand);box-shadow:var(--shadow)}
.mslot.active{border-color:var(--brand);border-style:dashed}
.mslot.active:hover{transform:translateY(-2px)}
.mslot-fig{aspect-ratio:4/3;background:var(--card-2);display:grid;place-items:center;overflow:hidden}
.mslot-fig img{width:100%;height:100%;object-fit:contain}
.mslot-fig svg{width:34px;height:34px;color:var(--faint)}
.mslot-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-height:44px;border-top:1px solid var(--line)}
.mslot-label{font-family:var(--display);font-weight:600;font-size:14px;color:var(--text);line-height:1.15}
.mslot-empty{font-size:13px;color:var(--faint)}
.mslot-mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.mslot-mark svg{width:14px;height:14px}
.mslot-mark.ok{background:var(--mint)} .mslot-mark.no{background:var(--clay)}
.mslot.correct{border-color:var(--mint)} .mslot.correct .mslot-foot{background:var(--mint-soft)}
.mslot.wrong{border-color:var(--clay)} .mslot.wrong .mslot-foot{background:var(--clay-soft)}
.mslot-answer{position:absolute;top:8px;left:8px;background:var(--mint);color:#fff;font-family:var(--display);font-weight:600;
  font-size:12px;padding:3px 9px;border-radius:7px;box-shadow:var(--shadow)}
.match-bank-wrap{background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.match-bank{display:flex;flex-wrap:wrap;gap:9px}
.mtoken{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;border:1.5px solid var(--line-2);background:var(--card);
  color:var(--text);padding:9px 14px;border-radius:11px;font-family:var(--display);font-weight:600;font-size:14px;transition:.13s}
.mtoken small{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--muted)}
.mtoken:not(:disabled):hover{border-color:var(--brand);transform:translateY(-2px)}
.mtoken.sel{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:var(--glow)}
.mtoken.sel small{color:rgba(255,255,255,.8)}
.mtoken.used{opacity:.4;text-decoration:line-through}
.mtoken.used small{text-decoration:none}
.match-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.match-score{font-family:var(--display);font-weight:700;font-size:18px;color:var(--text)}
.match-score.all{color:var(--mint)}
@media(max-width:520px){.match-imgs{gap:9px}.mslot-foot{padding:8px 10px}}
/* ---- progression dashboard ---- */
.rank-card{padding:20px;margin-bottom:18px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border:0}
.rank-main{display:flex;align-items:center;gap:16px}
.rank-ic{width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--xp-from),var(--xp-to));box-shadow:0 6px 16px rgba(244,180,0,.4)}
.rank-ic svg{width:26px;height:26px}
.rank-info{flex:1;min-width:0}
.rank-name{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.rank-sub{color:rgba(255,255,255,.82);font-size:13px;margin-top:3px}
.rank-xp{font-family:var(--display);font-weight:700;font-size:26px;color:#fff;white-space:nowrap}
.rank-xp span{font-size:12px;color:rgba(255,255,255,.72);margin-left:4px;font-weight:600}
.rank-bar{height:10px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:15px}
.rank-bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--xp-from),var(--xp-to));transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* ---- dashboard: Action-First Launchpad ---- */
.dash-mission h1{font-size:24px;line-height:1.25;margin:6px 0 18px;letter-spacing:-.01em;color:var(--text);max-width:34ch}
.btn-mission{width:100%;justify-content:center;padding:16px 20px;font-size:16.5px;font-weight:700;border-radius:14px;margin-bottom:14px}
.btn-mission svg{width:20px;height:20px}
.budget-pills{display:flex;gap:8px;flex-wrap:wrap}
.dash-ready{margin-bottom:18px}
.ready-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ready-ring-wrap{position:relative;width:96px;height:96px;flex:none}
.ready-ring{width:100%;height:100%;transform:rotate(-90deg)}
.ready-ring-bg{fill:none;stroke:var(--card-2);stroke-width:9}
.ready-ring-fg{fill:none;stroke:var(--success);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ready-ring-fg.mid{stroke:var(--accent)} .ready-ring-fg.low{stroke:var(--clay)}
.ready-ring-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ready-ring-pct b{font-family:var(--display);font-size:21px;color:var(--text)}
.ready-ring-pct span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ready-tiers{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px}
.ready-tier{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.ready-g{background:var(--success)} .ready-y{background:var(--accent)} .ready-r{background:var(--clay)}
.ach-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;cursor:pointer;margin-top:4px}
.ach-row:hover{border-color:var(--brand)}
.ach-ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:var(--brand-deep)}
.ach-ic svg{width:16px;height:16px}
.ach-text{flex:1;font-size:13.5px;font-weight:600;color:var(--text)}
.ach-cv{flex:none;color:var(--faint);display:flex}
.ach-cv svg{width:17px;height:17px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
/* ---- proficiency achievements ---- */
.prof-sub{display:flex;align-items:center;gap:7px;margin:18px 0 12px;font-size:12px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.prof-sub svg{width:15px;height:15px;color:var(--accent)}
.prof-list{display:flex;flex-direction:column;gap:10px}
.prof-brand{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card-2)}
.prof-brand[open]{padding-bottom:10px}
.prof-bhead{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none}
.prof-bhead::-webkit-details-marker{display:none}
.prof-cv{flex:none;color:var(--faint);transition:transform .15s}
.prof-cv svg{width:15px;height:15px;display:block}
.prof-brand[open] .prof-cv{transform:rotate(180deg)}
.prof-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.prof-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--faint);flex:none}
.prof-badge svg{width:15px;height:15px}
.prof-badge.on{background:var(--accent);border-color:var(--accent);color:var(--brand-deep);box-shadow:0 2px 8px rgba(244,180,0,.35)}
.prof-bname{flex:1;min-width:0;font-weight:700;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-bstate{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.prof-bstate.on{color:var(--success)}
.prof-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--card) 50%,transparent);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:20px;padding:3px 9px;box-shadow:inset 0 1px 0 var(--glass-hi)}
.prof-chip b{font-family:var(--display);font-weight:700;color:var(--muted)}
.prof-chip.on{border-color:var(--success);color:var(--text);background:color-mix(in srgb,var(--success) 12%,var(--card))}
.prof-chip.on b{color:var(--success)}
.bdg{text-align:center;padding:15px 10px;border-radius:var(--radius);background:var(--card-2);border:1px solid var(--line)}
.bdg-ic{width:46px;height:46px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--xp-from),var(--xp-to));box-shadow:0 5px 14px rgba(255,77,109,.28)}
.bdg-ic svg{width:23px;height:23px}
.bdg.locked{opacity:.6}
.bdg.locked .bdg-ic{background:var(--line-2);color:var(--faint);box-shadow:none}
.bdg-name{font-size:12.5px;font-weight:600;line-height:1.2;color:var(--text)}
.bdg-when{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.3}
@media(max-width:520px){.rank-xp{font-size:20px}.rank-name{font-size:19px}}
.theme-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a3a50;
  background:transparent;color:#c2d0de;font-weight:600;font-size:13.5px;margin-bottom:10px;transition:.15s}
.theme-toggle:hover{background:var(--ink-2);color:#fff}
.theme-toggle svg{width:18px;height:18px}
.tb-theme{background:var(--card-2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.tb-theme svg{width:18px;height:18px}
.tb-actions{display:flex;align-items:center;gap:9px}

.section-gap{height:18px}
.muted{color:var(--muted)} .right{margin-left:auto} .center{text-align:center}
.flex{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:11px 13px;min-height:46px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}

/* ---------- Mobile ---------- */
.bottom-nav{display:none}
@media (max-width:900px){
  .sidebar{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:40;
    background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    color:var(--text);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
  .topbar .brand{padding:0}
  .topbar .brand-name{color:var(--text)}
  .topbar .brand-sub{display:none}
  .topbar .tb-due{background:var(--amber);color:#3a2606;font-weight:700;font-size:12.5px;padding:4px 11px;border-radius:20px;font-family:var(--display)}
  .topbar .sync-pill{font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:20px;font-family:var(--display)}
  .topbar .sync-pill.syncing{background:var(--brand-soft);color:var(--brand-deep)}
  .topbar .sync-pill.pending{background:var(--card-2);color:var(--muted)}
  .topbar .sync-pill.offline{background:var(--clay-soft);color:var(--clay)}
  .topbar .sync-pill.error{background:var(--clay-soft);color:var(--clay)}
  .view{padding:18px 15px calc(86px + env(safe-area-inset-bottom))}
  .view-head h1{font-size:22px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat .val{font-size:26px}
  .dash-split{grid-template-columns:1fr}
  .study-setup{grid-template-columns:1fr}
  .map-grid{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;border-top:1px solid var(--line)}
  .bn-btn{flex:1;background:0;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;padding:5px 2px;border-radius:9px;position:relative;transition:transform .15s cubic-bezier(.4,0,.2,1),color .2s ease}
  .bn-btn:active{transform:scale(.96)}
  .bn-btn svg{width:22px;height:22px}
  .bn-btn.active{color:var(--brand)}
  .bn-badge{position:absolute;top:0;right:50%;margin-right:-22px;background:var(--amber);color:#3a2606;font-size:9.5px;
    font-weight:700;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
  .rate-row{gap:6px}
  .rate{padding:11px 3px}
  .kv{grid-template-columns:108px 1fr}
}

/* ---- page transitions (View Transitions API) ---- */
::view-transition-old(root){ animation-duration:.20s; animation-timing-function:ease; }
::view-transition-new(root){ animation-duration:.30s; animation-timing-function:cubic-bezier(.2,.8,.2,1); }

@keyframes cardrise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
#view.stagger > *{ animation:cardrise .46s cubic-bezier(.2,.8,.2,1) both; }
#view.stagger > *:nth-child(1){animation-delay:0s}
#view.stagger > *:nth-child(2){animation-delay:.05s}
#view.stagger > *:nth-child(3){animation-delay:.10s}
#view.stagger > *:nth-child(4){animation-delay:.15s}
#view.stagger > *:nth-child(5){animation-delay:.20s}
#view.stagger > *:nth-child(6){animation-delay:.25s}
#view.stagger > *:nth-child(7){animation-delay:.30s}
#view.stagger > *:nth-child(n+8){animation-delay:.34s}
@media (prefers-reduced-motion: reduce){
  #view.stagger > *{ animation:none; }
  ::view-transition-old(root),::view-transition-new(root){ animation:none; }

function featureLines(){
  const seen=new Set(), lines=[];
  for(const k in DEFAULT_LINE_FEATURES){
    const sheet=DEFAULT_LINE_FEATURES[k];
    if(seen.has(sheet)) continue;
    seen.add(sheet); lines.push({key:k, sheet});
  }
  for(const k in ALLIANCE_QUESTIONS){   // "core" has no feature sheet at all — only exists via questions
    if(!lines.some(l=>l.key===k)) lines.push({key:k, sheet:null});
  }
  return lines;
}
function featureItemKey(lineKey,item){ return lineKey+':'+norm(item.t).replace(/ /g,'-'); }
// Question items get a distinct ":q:" namespace segment in their key — guarantees no
// collision with a feature item's key even if title text ever happened to coincide,
// without touching the existing feature-item key format (would silently orphan every
// rep's already-earned pitch-drill progress on the next content update otherwise).
function questionItemKey(lineKey,item){ return lineKey+':q:'+norm(item.t).replace(/ /g,'-'); }
function allFeatureItems(){
  const out=[];
  for(const {key:lineKey,sheet} of featureLines()){
    for(const item of (sheet&&sheet.items||[])) out.push({lineKey, key:featureItemKey(lineKey,item), ...item});
  }
  for(const lineKey in ALLIANCE_QUESTIONS){
    for(const item of ALLIANCE_QUESTIONS[lineKey].items) out.push({lineKey, key:questionItemKey(lineKey,item), type:'question', ...item});
  }
  return out;
}

   'deltasolo' here will correctly, harmlessly return an empty deck rather than throw —
   use 'deltaultralite' to reach that content. */
function buildQuestionDeck(lineKey,mode){
  const all=allFeatureItems().filter(i=>i.type==='question');
  if(lineKey) return shuffle(all.filter(i=>i.lineKey===lineKey));
  if(mode==='full') return shuffle(all);
  // no line specified: an "all categories" quick-drill — prioritize whatever hasn't
  // been mastered yet, diversified across categories so one can't dominate the deck,
  // capped at 10 (same pattern already used for the general pitch-drill quick-drill)
  const byTier=t=>all.filter(i=>featureProgress(i.key).tier===t);
  const pool=byTier(0).concat(byTier(1)).concat(byTier(2));
  return pickDiversified(pool,10,i=>i.lineKey);
}
// Shuffles a question's options and returns a FRESH object (never mutates the shared
// ALLIANCE_QUESTIONS registry — every drill run needs its own shuffle) with
// correctness tracked by POSITION after shuffling, not by string value. Value-based
// matching would break silently if two options ever had identical text; index-based
// tracking through an explicit {text, originalIndex} pairing can't have that failure
// mode regardless of the content.
function prepareQuestionItem(questionObj){
  const indexed=questionObj.options.map((text,originalIndex)=>({text,originalIndex}));
  const shuffled=shuffle(indexed);
  const correctSet=new Set(questionObj.correctIndexes);
  const correctPositions=[];
  const options=shuffled.map((o,newIndex)=>{ if(correctSet.has(o.originalIndex)) correctPositions.push(newIndex); return o.text; });
  return { ...questionObj, options, correctPositions, isMulti:questionObj.correctIndexes.length>1 };
}
/* ---------- Alliance training questions: evaluation logic (Micro-Task 2B) ----------
   selectedOptionIndex accepts either a single number (single-select) or an array
   (multi-select) — the signature this was requested with takes a single index, but
   about a third of the real content is multi-select, where correctness genuinely
   requires comparing a whole selected SET, not one index. Accepting both means every
   real question evaluates correctly with one function, no special case at the call site. */
function evaluateQuestionAnswer(item,selectedOptionIndex){
  const selected=Array.isArray(selectedOptionIndex)?selectedOptionIndex:[selectedOptionIndex];
  const correctSet=new Set(item.correctPositions);
  const selectedSet=new Set(selected);
  // exact match required: missing a correct option or including an extra wrong one
  // both count as incorrect — picking 4 of 5 right answers isn't a correct answer
  const isCorrect=correctSet.size===selectedSet.size && [...correctSet].every(i=>selectedSet.has(i));
  recordFeatureAnswer(item.key,isCorrect);   // persists via the existing tracker, N=2/N=3 threshold applied automatically based on item.type
  const p=featureProgress(item.key);
  const newStatus=p.tier===2?'Mastered':(p.tier===1?'Learning':'Unseen');
  return {
    isCorrect,
    explanation: item.explanation||null,
    newStatus,
    // Informational only — NOT something a caller needs to build or pass anywhere.
    // recordFeatureAnswer (above) and the existing push/pull sync layer already add
    // this "feature:" prefix internally and automatically; this is just confirming
    // what key the eventual Supabase row will sync under.
    syncKey: 'feature:'+item.key,
  };
}
/* ---------- Alliance training questions: UI card (Micro-Task 2C) ----------

   chosen positions; item.answered, a bool) rather than taking extra parameters —
   keeps the signature to just (item) as asked, with the caller (session wiring, next
   micro-task) responsible for attaching/updating that state between renders.
   Handler names referenced in the markup — selectPitchQuestionOption(i) for
   single-select, togglePitchQuestionOption(i) + submitPitchQuestionAnswer() for

   the exact names now in case different ones are wanted before they get built. */
function renderQuestionCard(item){

      else if(!correctSet.has(i)&&selectedSet.has(i)) cls='wrong';

    const handler=item.isMulti?`togglePitchQuestionOption(${i})`:`selectPitchQuestionOption(${i})`;
    return `<button class="choice ${cls}" ${answered?'disabled':''} onclick="${handler}">${checkbox}${esc(text)}</button>`;
  }).join('');

    ? `<button class="btn btn-primary" style="width:100%;margin-top:4px" ${selected.length?'':'disabled'} onclick="submitPitchQuestionAnswer()">${svg(I.check)} Submit Answer</button>`
    : '';

    ? `<div class="pitch-rationale">${svg(I.speech)}<span><b>Alliance Rationale:</b> ${esc(item.explanation)}</span></div>`

    <h3 style="margin-bottom:12px">${esc(item.t)}</h3>

}

function inferTags(u){
  const text = norm([u.model,u.productLine,u.category,u.rvType,u.description].join(' '));
  const tags=new Set();
  for(const cat of CATEGORIES){
    if(cat.id==='couples'||cat.id==='family') continue;
    for(const kw of cat.kw){ if(text.includes(norm(kw))){ tags.add(cat.id); break; } }
  }
  const code=String(u.model||'').toUpperCase();
  for(const [re,id] of CODE_ABBR){ if(re.test(code)) tags.add(id); }
  const sleeps=Number(u.sleeps)||0;
  const familyish = tags.has('bunkhouse')||tags.has('mid_bunk')||tags.has('loft')||sleeps>=6||/family/.test(text);
  const couplish = (!tags.has('bunkhouse')&&!tags.has('mid_bunk')&&sleeps>0&&sleeps<=4)||/couple/.test(text);
  if(familyish) tags.add('family');
  if(couplish && !familyish) tags.add('couples');
  return [...tags];
}

const DAY=86400000;
function newSRS(){ return {ease:2.5,interval:0,reps:0,lapses:0,reviews:0,due:Date.now(),lastReviewed:null,history:[]}; }
function fmtInterval(d){
  if(d<1) return '<1d'; if(d<30) return Math.round(d)+'d';
  if(d<365) return (d/30).toFixed(d<60?0:0)+'mo'; return (d/365).toFixed(1)+'y';
}
function previewIntervals(c){

  return {again:'10m',hard:'1d',good:'2d',easy:'3d'};

function schedule(c,rating,now){
  now=now||Date.now();
  c.reviews=(c.reviews||0)+1; c.lastReviewed=now;
  let i=c.interval||0,e=c.ease||2.5,r=c.reps||0;
  if(rating==='again'){ c.lapses=(c.lapses||0)+1; r=0; e=Math.max(1.3,e-0.2); i=0; c.due=now+10*60*1000; }
  else if(rating==='hard'){ e=Math.max(1.3,e-0.15); i=1; r++; c.due=now+i*DAY; }   // Needs Work -> 1d
  else if(rating==='good'){ i=2; r++; c.due=now+i*DAY; }                            // Fair       -> 2d
  else if(rating==='easy'){ e=e+0.15; i=3; r++; c.due=now+i*DAY; }                  // Got it     -> 3d
  c.interval=i; c.ease=e; c.reps=r;
  c.updatedAt=now;   // local edit timestamp — protects against a remote pull overwriting progress that hasn't been pushed yet
  (c.history=c.history||[]).push({t:now,r:rating}); if(c.history.length>40) c.history=c.history.slice(-40);
}
const mature = ()=> (state.settings.mature||21);
function masteryScore(c){ if(!c.reviews) return 0; return Math.max(0,Math.min(1,c.interval/mature())); }
function unitStatus(c){
  if(!c.reviews) return 'new';
  if(c.interval<1) return 'learning';
  if(c.interval>=mature()) return 'mastered';
  return 'young';
}
function isReviewDue(c,now){ return c.reviews>0 && c.due<=now; }
function isNew(c){ return !c.reviews; }
function isWeak(c){ return c.reviews>0 && (c.lapses>=2 || c.ease<2.0 || masteryScore(c)<0.45); }

function rankForXP(xp){ let r=RANKS[0]; for(const k of RANKS){ if((xp||0)>=k.xp) r=k; else break; } return r; }
function nextRank(xp){ return RANKS.find(k=>k.xp>(xp||0))||null; }
function rankProgress(xp){
  xp=xp||0; const current=rankForXP(xp), next=nextRank(xp);
  if(!next) return {current,next:null,pct:100,into:0,span:0,toNext:0};
  const span=next.xp-current.xp, into=xp-current.xp;

const MASTERY_LEVELS = [

function masteryLevelFor(score){ for(let i=MASTERY_LEVELS.length-1;i>=0;i--){ if(score>=MASTERY_LEVELS[i].min) return MASTERY_LEVELS[i].name; } return 'Learning'; }
function masteryRank(name){ return MASTERY_LEVELS.findIndex(l=>l.name===name); }
function unitMastery(u){ if(!u.mastery) u.mastery={score:0,level:'Learning',everMastered:false}; return u.mastery; }
function applyMastery(u,delta){
  const m=unitMastery(u), prev=m.level;
  m.score=Math.max(0,Math.min(100,Math.round((m.score||0)+delta)));
  m.level=masteryLevelFor(m.score);
  const firstMastered = m.level==='Mastered' && !m.everMastered;
  if(firstMastered) m.everMastered=true;
  m.nextReview = u.srs ? u.srs.due : Date.now();   // mirror of SRS schedule for display
  return {prev,level:m.level,firstMastered};
}
function masteryStats(){

/* ---- progression state + answer recording ---- */
function ensureProgress(){
  if(typeof state.xp!=='number') state.xp=0;
  state.progress = state.progress||{};
  state.progress.streak = state.progress.streak||{current:0,longest:0,lastDay:null};
  state.progress.stats  = state.progress.stats ||{correct:0,answered:0};
  state.progress.badges = state.progress.badges||{};
  state.progress.lineDrills = state.progress.lineDrills||{};
  if(!Array.isArray(state.removedSeed)) state.removedSeed=[];
  state.lineFeatures = state.lineFeatures||{};
  state.lineIntros = state.lineIntros||{};
  // Baked cheat-sheet content is version-stamped: on a version bump, re-seed the
  // default lines (overwriting them) so content updates land; custom keys are left alone.
  if(state.lfSeedVersion!==LF_SEED_VERSION){
    for(const k in DEFAULT_LINE_FEATURES){
      const def=DEFAULT_LINE_FEATURES[k];
      state.lineFeatures[k]=(def.items||[]).map(x=>({...x}));
      if(def.intro) state.lineIntros[k]=def.intro; else delete state.lineIntros[k];
    }
    state.lfSeedVersion=LF_SEED_VERSION;
  }
  for(const u of state.units) unitMastery(u);
}
const dayKey = t => new Date(t||Date.now()).toISOString().slice(0,10);
function touchDailyStreak(){
  const s=state.progress.streak, today=dayKey();
  if(s.lastDay===today) return;
  s.current = (s.lastDay===dayKey(Date.now()-DAY)) ? (s.current+1) : 1;
  s.lastDay=today; s.longest=Math.max(s.longest||0,s.current);
}
/* The single entry point study/match call after each answer. */
function recordAnswer(u,correct,opts){
  opts=opts||{}; ensureProgress(); touchDailyStreak();
  state.progress.stats.answered++;
  if(session){ session._correct=session._correct||new Set(); session._wrong=session._wrong||new Set(); (correct?session._correct:session._wrong).add(u.id); }
  if(session) session._ansStreak = correct ? (session._ansStreak||0)+1 : 0;
  if(correct){
    state.progress.stats.correct++;
  }
  const delta = opts.delta!=null ? opts.delta : (correct?MASTERY_DELTA.correct:MASTERY_DELTA.incorrect);
  const res = applyMastery(u,delta);
  if(res.firstMastered){ setTimeout(()=>toast(unitTitle(u)+' mastered!','ok'),120); }
  if(session && opts.test){ session._qTotal=(session._qTotal||0)+1; if(correct) session._qCorrect=(session._qCorrect||0)+1; }
  const newly=evaluateBadges();
  newly.forEach((b,i)=>setTimeout(()=>toast('Badge unlocked · '+b.label,'ok'),300+i*250));
}

function encodeGhPath(p){ return String(p).split('/').map(encodeURIComponent).join('/'); }

  if(!unit) return null;
